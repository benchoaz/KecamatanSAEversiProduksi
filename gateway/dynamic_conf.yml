# ============================================================
# Traefik Dynamic Configuration — Shared Middlewares Only
# Routers & services are handled by Docker labels on each container.
# HTTP→HTTPS redirect is handled by entrypoint command flags.
# ============================================================

http:
  middlewares:
    # --- Compression ---
    kecamatan-compress:
      compress: {}

    # --- Security Headers ---
    kecamatan-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        frameDeny: true
        referrerPolicy: "strict-origin-when-cross-origin"

    # --- Rate Limiting ---
    kecamatan-rate:
      rateLimit:
        average: 100
        burst: 50

    # --- Retry on Network Error ---
    kecamatan-buffer:
      buffering:
        retryExpression: "IsNetworkError() && Attempts() <= 2"

  routers:
    kecamatan:
      rule: "Host(`kecamatanbesuk.web.id`) || Host(`localhost`) || Host(`localhost:8447`) || Host(`localhost:8086`)"
      entryPoints:
        - websecure
      tls:
        certResolver: myresolver
      service: kecamatan
      middlewares:
        - kecamatan-compress
        - kecamatan-headers
        - kecamatan-rate

  services:
    kecamatan:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8081"
