services:
  gateway:
    image: traefik:latest
    container_name: kecamatan-traefik-gateway
    restart: unless-stopped
    
    stop_grace_period: 30s
    command:
    - --log.level=INFO
    - --api.insecure=false
    - --ping=true
    - --providers.file.filename=/etc/traefik/dynamic_conf.yml
    - --providers.file.watch=false
    - --entrypoints.web.address=:80
    - --entrypoints.web.http.redirections.entrypoint.to=websecure
    - --entrypoints.web.http.redirections.entrypoint.scheme=https
    - --entrypoints.web.http.redirections.entrypoint.permanent=true
    - --entrypoints.websecure.address=:443
    - --certificatesresolvers.myresolver.acme.tlschallenge=true
    - --certificatesresolvers.myresolver.acme.email=${ACME_EMAIL:-benchoaz@gmail.com}
    - --certificatesresolvers.myresolver.acme.storage=/acme.json
    ports:
    - 8086:80
    - 8447:443
    volumes:
    - ./gateway/dynamic_conf.yml:/etc/traefik/dynamic_conf.yml:ro
    - ./gateway/acme_new.json:/acme.json
    healthcheck:
      test:
      - CMD
      - traefik
      - healthcheck
      - --ping
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: production
    container_name: kecamatan-app
    restart: unless-stopped
    network_mode: "service:gateway"
    working_dir: /var/www
    env_file: ./app/.env
    volumes:
    - ./app/app:/var/www/app:rw
    - ./app/routes:/var/www/routes:rw
    - ./app/resources/views:/var/www/resources/views:rw
    - ./app/database/migrations:/var/www/database/migrations:rw
    - ./app/storage:/var/www/storage:rw
    - ./app/.env:/var/www/.env
    healthcheck:
      test:
      - CMD
      - php-fpm
      - -t
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  nginx:
    image: nginx:alpine
    container_name: kecamatan-nginx
    restart: unless-stopped
    network_mode: "service:gateway"
    volumes:
    - ./app/public:/var/www/public:ro
    - ./app/storage:/var/www/storage:ro
    - ./app/docker/nginx/conf.d:/etc/nginx/conf.d:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  db:
    image: postgres:17-alpine
    container_name: kecamatan-db
    restart: unless-stopped
    network_mode: "service:gateway"
    environment:
      POSTGRES_DB: dashboard_kecamatan
      POSTGRES_USER: ${DB_USERNAME:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DB_USERNAME:-user} -d dashboard_kecamatan
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  redis:
    image: redis:7-alpine
    container_name: kecamatan-redis
    restart: unless-stopped
    network_mode: "service:gateway"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
  scheduler:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: production
    container_name: kecamatan-scheduler
    restart: unless-stopped
    network_mode: "service:gateway"
    working_dir: /var/www
    env_file: ./app/.env
    command: 'sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"'
    volumes:
    - ./app/storage:/var/www/storage:rw
    - ./app/.env:/var/www/.env
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  sae-engine:
    build:
      context: ./apps/sae-engine
      dockerfile: Dockerfile
    container_name: kecamatan-sae-engine
    restart: unless-stopped
    network_mode: "service:gateway"
    env_file: ./app/.env
    environment:
    - SAE_ENGINE_PORT=9005
    - DB_HOST=127.0.0.1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  pgdata:
    name: kecamatansae_pgdata
  redis_data:
    name: kecamatansae_redis_data
